# Quick test config — 5 epochs, small batch, CPU-friendly
model:
  num_classes: 7
  cam_channels: 3
  lidar_channels: 2
  embed_dim: 256
  dropout: 0.1

classes:
  - {name: background, id: 0, color: [0, 0, 0]}
  - {name: traversable_soil, id: 1, color: [194, 178, 128]}
  - {name: bedrock, id: 2, color: [128, 128, 128]}
  - {name: small_rock, id: 3, color: [255, 165, 0]}
  - {name: large_boulder, id: 4, color: [255, 0, 0]}
  - {name: slope, id: 5, color: [255, 255, 0]}
  - {name: shadow, id: 6, color: [64, 0, 128]}

data:
  image_size: [256, 256]
  train_dir: data/train
  val_dir: data/val
  test_dir: data/test
  batch_size: 2
  num_workers: 0
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  lidar_mean: [0.0, 0.0]
  lidar_std: [1.0, 1.0]
  augmentation:
    random_flip: true
    random_scale: [0.5, 2.0]
    random_crop: [256, 256]
    color_jitter: {brightness: 0.3, contrast: 0.3, saturation: 0.2, hue: 0.05}
    random_rotation: 10

training:
  epochs: 5
  optimizer:
    type: AdamW
    lr: 6.0e-5
    weight_decay: 0.01
    betas: [0.9, 0.999]
  scheduler:
    type: polynomial
    power: 1.0
    min_lr: 0.0
    warmup_epochs: 1
  class_weights: [0.5, 1.0, 1.2, 2.0, 2.5, 1.8, 1.5]
  ignore_index: 255
  mixed_precision: false
  gradient_clip: 1.0
  log_interval: 25
  val_interval: 5
  checkpoint_dir: checkpoints/

deploy:
  onnx: {opset_version: 17, dynamic_axes: false, input_shape: [1,3,256,256], lidar_shape: [1,2,256,256]}
  tensorrt: {precision: int8, workspace_mb: 1024, calibration_batches: 10, calibration_cache: deploy/calibration.cache}
  target: {device: orin_nano, jetpack: "6.0", cuda: "12.2", tensorrt: "8.6"}

ros2:
  camera_topic: /rover/camera/image_raw
  lidar_topic: /rover/lidar/points
  output_topic: /rover/segmentation/costmap
  frame_id: base_link
  publish_rate: 30
  visualization: true
