[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segformer-lidar-fusion"
version = "0.1.0"
description = "SegFormer-B0 + LiDAR Fusion for ERC Martian terrain segmentation on Jetson Orin Nano"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
train = [
    "tensorboard>=2.14",
    "tqdm>=4.66",
]
deploy = [
    "onnx>=1.14",
    "onnxruntime>=1.16",
]
ros2 = [
    "opencv-python>=4.8",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["segformer_lidar_fusion*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
